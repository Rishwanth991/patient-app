<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Patient Management System</title>
<form action="add" method="get">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:500px;
    margin:50px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:#0d6efd;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#198754;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#146c43;
}

table{
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0d6efd;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Patient Registration</h1>

<form action="PatientServlet" method="post">

<input type="text" name="pid" placeholder="Patient ID" required>

<input type="text" name="pname" placeholder="Patient Name" required>

<input type="number" name="age" placeholder="Age" required>

<select name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input type="text" name="disease" placeholder="Disease" required>

<input type="text" name="mobile" placeholder="Mobile Number" required>

<button type="submit">Save Patient</button>
</form>
<br><br>
<form action="viewpatients" method="get">
<button type="submit">view patients</button>
</form>



</div>


</body>
</html>
